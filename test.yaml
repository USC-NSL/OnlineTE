# topo: Cogentco
# topo: Interoute
topo: Claranet
tm_seed: 12345
objective: MLU
report_unsat: True
# scale_factor: 20.0
scale_factor: 10.0
synch:
  # num_workers: 49
  num_workers: 1
  # local: True
  mlu_backend: pdlp
  SolverParams:
    InnerLoopRounds: 5
    OuterLoopRounds: 100
    SwitchIterations: 1
    Precision: single
    Eta: 0.2
    # Beta: 8e-5
    X0Type: PSEUDO_INVERSE
    # X0Type: CSR_SHORTEST_PATH
  PDLPMLUParams:
    Threads: 1
  comm_backend: mcast
  Mcast:
    UpdateCopyCount: 1

