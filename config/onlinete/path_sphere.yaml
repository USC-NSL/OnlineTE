objective: MLU
topo_name: Cogentco
tm_seed: 123
topo_seed: 456
initial_tm_seed: 789
EvaluationParams:
  feasibility_tolerance: 1e-5
  optimality_tolerance: 1e-5
  loop_tolerance: 1e-3
  sequence_length: 20
  scale_factor: 10
  verbose: true
  # We will validate the output of OnlineTE against this
  # trace generated by Gurobi
  trace_reference: Cogentco_trace_MLU.txt
tm_class: sampled
sampled:
  sample_rate: 0.05
  delta_min: -1
  delta_max: 1
initial_tm_class: uniform
initial_tm.uniform:
  min: 1e-2
  max: 1
solver: online_te
online_te:
  mlu_backend: pdlp
  num_workers: 49
  SolverParams:
    Eta: 0.1
    Gamma: 0.1
    InnerLoopRounds: 10
    OuterLoopRounds: 200
    SwitchIterations: 10
    AdjustGamma: true
    ScaleWithCapacity: false
    NumberOfPathsPerCommodity: 16
    PathFile: paths_Cogentco.pkl
