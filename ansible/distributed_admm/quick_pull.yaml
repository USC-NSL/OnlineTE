---
- name: Pull changes
  hosts: workers_group
  gather_facts: false
  remote_user: "{{ lookup('env', 'SPHERE_USER') }}"
  vars: 
    access_token: "{{ lookup('env', 'GIT_ACCESS_TOKEN') }}"
    path_home: "{{ lookup('env', 'SPHERE_HOME') }}"
    path_venv: "{{ lookup('env', 'VENV_HOME') }}"
    path_launch: "{{ lookup('env', 'LAUNCH_FILE' )}}"
    branch: "{{ lookup('env', 'GIT_BRANCH') }}"
  module_defaults:
    ansible.builtin.shell:
      chdir: "{{path_home}}"
    ansible.builtin.command:
      chdir: "{{path_home}}"
  tasks:
  - name: Clone repo with force
    ansible.builtin.git:
      repo: https://{{access_token}}@github.com/USC-NSL/OnlineTE.git
      clone: true
      force: true
      dest: "{{path_home}}"
      version: "{{branch}}"
