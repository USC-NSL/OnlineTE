---
# Playbook for updating code only
- name: Pull changes
  hosts: controller_group:workers_group
  gather_facts: false
  remote_user: "{{ lookup('env', 'SPHERE_USER') }}"
  vars: 
    access_token: "{{ lookup('env', 'GIT_ACCESS_TOKEN') }}"
    path_home: "{{ lookup('env', 'SPHERE_HOME') }}"
    path_venv: "{{ lookup('env', 'VENV_HOME') }}"
    path_launch: "{{ lookup('env', 'LAUNCH_FILE' )}}"
  module_defaults:
    ansible.builtin.shell:
      chdir: "{{path_home}}"
    ansible.builtin.command:
      chdir: "{{path_home}}"
  tasks:
  - name: Clone repo with force
    ansible.builtin.git:
      repo: https://{{access_token}}@github.com/USC-NSL/DistributedTE.git
      clone: true
      force: true
  
  - name: Compile protobuffs
    command: chdir="{{path_home}}" "{{path_venv}}/bin/python protos/__init__.py"

  - name: Give EXEC Premission To Launcher
    command: chmod +x "{{path_launch}}"
    when: "'workers_group' in group_names"
