---
# Prepare controller/worker nodes from scratch (i.e. assume no packages are installed)
- name: Configure APT dependencies
  hosts: controller_group:workers_group
  become: true
  tasks:
  - name: Gather Package Facts
    package_facts:
      manager: apt

  - name: Ensure git
    ansible.builtin.apt:
      update_cache: true
      name: git
    when: '"git" not in ansible_facts.packages'
  
  - name: Install python-dev
    ansible.builtin.apt:
      name: python3-dev
      state: present

- name: Clone repo and configure PIP
  hosts: controller_group:workers_group
  gather_facts: false
  remote_user: "{{ lookup('env', 'SPHERE_USER') }}"
  vars: 
    access_token: "{{ lookup('env', 'GIT_ACCESS_TOKEN') }}"
    path_home: "{{ lookup('env', 'SPHERE_HOME') }}"
    branch: "{{ lookup('env', 'GIT_BRANCH') }}"
  
  tasks:
  - name: Clone repo with force
    ansible.builtin.git:
      repo: https://{{access_token}}@github.com/USC-NSL/DistributedTE.git
      clone: true
      force: true
      dest: "{{path_home}}"
      version: "{{branch}}"

  - name: PIP install UV
    ansible.builtin.pip:
      name: uv
  
  - name: UV install requirements
    command: chdir="{{path_home}}" python3 -m uv pip install -r requirements.txt

# The zoo is not reachable anymore. I am going to use a local copy
